[metadata]
name = dancing-angels-ai
version = 0.2.0
description = Animate a character image from a driver motion video.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.package_data]
dancing_angels_ai = py.typed

[options.entry_points]
console_scripts =
    dancing-angels-ai = dancing_angels_ai.cli:main

[tool:pytest]
testpaths = tests
pythonpath = src
